name: Java CI 

on:
  push:
    branches: [ main, ci-setup ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar código principal
        run: |
          mkdir -p out
          javac -d out $(find app -MainTest "*.java")

      - name: Compilar pruebas
        run: |
          javac -d out $(find tests -MainTest "*.java")

      - name: Run Tests
        run: |
          java -cp out app.MainTest